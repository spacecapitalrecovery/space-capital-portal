<div id="key-screen">
  <h3>Space Capital Recovery</h3>
  <p>Enter your Anthropic API key to activate the AI features. It will be saved in your browser so you only need to do this once.</p>
  <input type="password" id="key-input" placeholder="Your API key here" />
  <button onclick="startApp()">Launch Portal</button>
</div>
<div id="splash">
  <h3>Space Capital Recovery</h3>
  <div class="bar"><div class="bar-fill" id="prog" style="width:10%"></div></div>
  <p id="msg">Loading portal...</p>
</div>
<div id="root"></div>
<script>
function setProgress(pct, msg){document.getElementById('prog').style.width=pct+'%';document.getElementById('msg').textContent=msg;}
function startApp(){
  var key=document.getElementById('key-input').value.trim();
  if(!key||!key.startsWith('sk-ant')){alert('Please enter a valid Anthropic API key');return;}
  localStorage.setItem('scrk',key);
  launchPortal(key);
}
function launchPortal(key){
  window.__AKEY__=key;
  document.getElementById('key-screen').style.display='none';
  document.getElementById('splash').style.display='flex';
  setTimeout(function(){
    setProgress(40,'Compiling...');
    setTimeout(function(){
      try{
        var src=document.getElementById('src').textContent;
        setProgress(70,'Starting...');
        var result=Babel.transform(src,{presets:['react']});
        setProgress(90,'Almost ready...');
        setTimeout(function(){
          var fn=new Function('React','ReactDOM',result.code+';const r=ReactDOM.createRoot(document.getElementById("root"));r.render(React.createElement(App));document.getElementById("splash").remove();');
          fn(React,ReactDOM);
        },100);
      }catch(e){
        document.getElementById('splash').innerHTML='<div style="padding:40px;text-align:center"><h3 style="color:#ef4444">Error</h3><p style="color:#9ca3af">'+e.message+'</p></div>';
      }
    },200);
  },300);
}
window.addEventListener('load',function(){
  var saved=localStorage.getItem('scrk');
  if(saved&&saved.startsWith('sk-ant')){launchPortal(saved);}
  else{document.getElementById('key-screen').style.display='flex';}
});
</script>

function exportCSV(accounts) {
  const headers = ["Debtor", "Client", "Amount Owed", "Collected", "Remaining", "Status", "Priority", "Submitted", "Notes"];
  const rows = accounts.map(a => {
    const paid = (a.payments || []).reduce((s, p) => s + p.amount, 0);
    const client = CLIENTS[a.clientId]?.name || a.clientId;
    return [
      `"${a.debtor}"`, `"${client}"`, a.amount, paid, Math.max(0, a.amount - paid),
      `"${a.status}"`, `"${a.priority}"`, `"${a.submitted}"`, `"${(a.notes || "").replace(/"/g, "'")}"`
    ].join(",");
  });
  const csv = [headers.join(","), ...rows].join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `space-capital-recovery-${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);
}

  const hasPayments = (account.payments || []).length > 0;
  const isHighRisk = account.priority === "High" && !hasPayments;
  const isResolved = account.status === "Resolved";
  if (isResolved) return {
    score: 95, rating: "Cooperative", ratingColor: "#10b981",
    summary: account.debtor + " has fully resolved their debt. This account is a model for successful collection.",
    tactics: ["Archive as resolved", "Request referral from client", "Use as a benchmark case"],
    nextAction: "Close and document the successful recovery strategy.",
    estimatedRecovery: "100%"
  };
  if (hasPayments) return {
    score: 74, rating: "Cooperative", ratingColor: "#10b981",
    summary: account.debtor + " has shown willingness to pay with " + account.payments.length + " payment(s). Continued engagement is likely to succeed.",
    tactics: ["Offer 10% discount for paying balance in full", "Send friendly reminders every 2 weeks", "Schedule a call to accelerate the payment timeline"],
    nextAction: "Call " + account.debtor + " this week about paying off the remaining balance.",
    estimatedRecovery: "85%"
  };
  if (isHighRisk) return {
    score: 28, rating: "High Risk", ratingColor: "#ef4444",
    summary: account.debtor + " has not responded to collection attempts with $" + account.amount + " outstanding. Escalation may be necessary.",
    tactics: ["Send formal demand letter via certified mail", "Attempt contact at different times of day", "Research debtor assets for legal action viability"],
    nextAction: "Send a formal 30-day demand letter to " + account.debtor + " today.",
    estimatedRecovery: "40%"
  };
  return {
    score: 52, rating: "Medium Risk", ratingColor: "#f59e0b",
    summary: account.debtor + " is a pending case requiring prompt follow-up. Early engagement is key to recovery.",
    tactics: ["Make initial contact within 48 hours", "Offer a flexible payment plan", "Document all communication attempts carefully"],
    nextAction: "Make first contact with " + account.debtor + " and offer a payment plan.",
    estimatedRecovery: "62%"
  };
}

function BarChart({ data, color = "#16a34a", maxVal }) {
  const max = maxVal || Math.max(...data.map(d => d.value), 1);
  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 8, height: 120, padding: "0 4px" }}>
      {data.map((d, i) => (
        <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
          <div style={{ fontSize: 10, color: "#6b7280", fontWeight: 600 }}>{d.value > 0 ? (d.value >= 1000 ? "$" + (d.value / 1000).toFixed(1) + "k" : "$" + d.value) : ""}</div>
          <div style={{ width: "100%", background: color, borderRadius: "4px 4px 0 0", height: Math.max(4, (d.value / max) * 90), transition: "height .4s", opacity: 0.85 }} />
          <div style={{ fontSize: 10, color: "#6b7280", whiteSpace: "nowrap" }}>{d.label}</div>
        </div>
      ))}
    </div>
  );
}

function DonutChart({ segments }) {
  const total = segments.reduce((s, x) => s + x.value, 0);
  let offset = 0;
  const r = 40, cx = 50, cy = 50, stroke = 14;
  const circ = 2 * Math.PI * r;
  const arcs = segments.map(seg => {
    const pct = total > 0 ? seg.value / total : 0;
    const dash = pct * circ;
    const arc = { color: seg.color, dash, offset: circ - offset, label: seg.label, value: seg.value, pct: Math.round(pct * 100) };
    offset += dash;
    return arc;
  });
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 20 }}>
      <svg width={100} height={100} viewBox="0 0 100 100">
        <circle cx={cx} cy={cy} r={r} fill="none" stroke="#1f2937" strokeWidth={stroke} />
        {arcs.map((a, i) => (
          <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={a.color} strokeWidth={stroke}
            strokeDasharray={`${a.dash} ${circ - a.dash}`} strokeDashoffset={a.offset}
            transform={`rotate(-90 ${cx} ${cy})`} style={{ transition: "stroke-dasharray .5s" }} />
        ))}
        <text x={cx} y={cy - 4} textAnchor="middle" fill="#f9fafb" fontSize="14" fontWeight="bold">{total}</text>
        <text x={cx} y={cy + 10} textAnchor="middle" fill="#6b7280" fontSize="8">accounts</text>
      </svg>
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {arcs.map((a, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 12 }}>
            <div style={{ width: 10, height: 10, borderRadius: 2, background: a.color, flexShrink: 0 }} />
            <span style={{ color: "#9ca3af" }}>{a.label}</span>
            <span style={{ color: "#f9fafb", fontWeight: 700, marginLeft: 4 }}>{a.value}</span>
            <span style={{ color: "#6b7280" }}>({a.pct}%)</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Payment Plan Calculator ────────────────────────────────────────────────
function PaymentPlanCalc({ account, paid, months, setMonths, down, setDown, discount, setDiscount, saved, onSave }) {
  const remaining = Math.max(0, account.amount - paid);
  const discountAmt = Math.round(remaining * (Number(discount) / 100));
  const afterDiscount = remaining - discountAmt;
  const afterDown = Math.max(0, afterDiscount - Number(down));
  const numMonths = Math.max(1, Number(months) || 1);
  const monthly = afterDown > 0 ? Math.ceil(afterDown / numMonths) : 0;

  // Build schedule
  const today = new Date();
  const schedule = [];
  if (Number(down) > 0) {
    schedule.push({ num: 0, label: "Down Payment", amount: Number(down), date: today.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) });
  }
  for (let i = 0; i < numMonths; i++) {
    const d = new Date(today);
    d.setMonth(d.getMonth() + i + 1);
    const isLast = i === numMonths - 1;
    // Last payment gets the remainder to avoid rounding drift
    const amt = isLast ? afterDown - (monthly * (numMonths - 1)) : monthly;
    schedule.push({ num: i + 1, label: `Payment ${i + 1}`, amount: Math.max(0, amt), date: d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) });
  }

  const plan = { months: numMonths, downPayment: Number(down), discount: Number(discount), discountAmt, monthly, total: afterDiscount, schedule, createdDate: today.toISOString().slice(0, 10) };

  const existing = account.paymentPlan;

  return (
    <div style={{ background: "linear-gradient(135deg,#0d1117,#111827)", border: "1px solid #3b82f644", borderRadius: 12, padding: 20, marginBottom: 20 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 18 }}>
        <span style={{ fontSize: 22 }}>📅</span>
        <div>
          <div style={{ fontSize: 14, fontWeight: 700, color: "#93c5fd" }}>Payment Plan Calculator</div>
          <div style={{ fontSize: 11, color: "#6b7280" }}>Build a structured repayment schedule</div>
        </div>
      </div>

      {/* Existing plan banner */}
      {existing && (
        <div style={{ background: "#16a34a18", border: "1px solid #16a34a44", borderRadius: 8, padding: "10px 14px", marginBottom: 16, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={{ fontSize: 13, color: "#4ade80" }}>✅ Active plan: {existing.months} months · {fmt(existing.monthly)}/mo · Created {existing.createdDate}</div>
          <button onClick={() => onSave(null)} style={{ background: "transparent", color: "#6b7280", border: "1px solid #374151", borderRadius: 6, padding: "4px 10px", fontSize: 11, cursor: "pointer" }}>Clear</button>
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12, marginBottom: 16 }}>
        {/* Months */}
        <div>
          <div style={{ fontSize: 11, color: "#9ca3af", marginBottom: 6 }}>Duration (months)</div>
          <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
            {["3", "6", "12", "18", "24"].map(m => (
              <button key={m} onClick={() => setMonths(m)} style={{ padding: "5px 10px", borderRadius: 6, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 600, background: months === m ? "#3b82f6" : "#1f2937", color: months === m ? "#fff" : "#9ca3af" }}>{m}mo</button>
            ))}
          </div>
        </div>
        {/* Down payment */}
        <div>
          <div style={{ fontSize: 11, color: "#9ca3af", marginBottom: 6 }}>Down Payment ($)</div>
          <input type="number" value={down} onChange={e => setDown(e.target.value)} min="0" max={remaining} style={{ width: "100%", background: "#0d1117", border: "1px solid #374151", borderRadius: 8, padding: "7px 10px", color: "#f9fafb", fontSize: 13, outline: "none", boxSizing: "border-box" }} />
        </div>
        {/* Discount */}
        <div>
          <div style={{ fontSize: 11, color: "#9ca3af", marginBottom: 6 }}>Settlement Discount (%)</div>
          <div style={{ display: "flex", gap: 4 }}>
            {["0", "10", "15", "20", "25"].map(d => (
              <button key={d} onClick={() => setDiscount(d)} style={{ flex: 1, padding: "5px 4px", borderRadius: 6, border: "none", cursor: "pointer", fontSize: 11, fontWeight: 600, background: discount === d ? "#f59e0b" : "#1f2937", color: discount === d ? "#fff" : "#9ca3af" }}>{d}%</button>
            ))}
          </div>
        </div>
      </div>

      {/* Summary */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 10, marginBottom: 16 }}>
        {[
          { l: "Balance Remaining", v: fmt(remaining), c: "#fbbf24" },
          { l: discount > "0" ? `After ${discount}% Discount` : "After Discount", v: fmt(afterDiscount), c: discount > "0" ? "#10b981" : "#6b7280" },
          { l: "Monthly Payment", v: fmt(monthly), c: "#93c5fd" },

    </div>
  );
}

// ── Invoice Generator ──────────────────────────────────────────────────────
function InvoiceGenerator({ accounts }) {
  const [clientId, setClientId] = useState("c1");
  const [feeType, setFeeType] = useState("contingency");
  const [feeRate, setFeeRate] = useState("25");
  const [flatFee, setFlatFee] = useState("500");
  const [dueDate, setDueDate] = useState(() => {
    const d = new Date(); d.setDate(d.getDate() + 30);
    return d.toISOString().slice(0, 10);
  });
  const [invoiceNum] = useState(() => "SCR-" + String(Math.floor(1000 + Math.random() * 9000)));
  const [notes, setNotes] = useState("Payment due within 30 days. Late payments subject to 1.5% monthly interest.");
  const [copied, setCopied] = useState(false);
  const [preview, setPreview] = useState(false);
  const [sending, setSending] = useState(false);
  const [sent, setSent] = useState(false);
  const [sendError, setSendError] = useState(null);

  const clientAccounts = accounts.filter(a => a.clientId === clientId);
  const client = CLIENTS[clientId];
  const today = new Date().toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
  const dueDateFmt = new Date(dueDate + "T00:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });

  const totalCollected = clientAccounts.reduce((s, a) => s + (a.payments || []).reduce((x, p) => x + p.amount, 0), 0);
  const totalOwed = clientAccounts.reduce((s, a) => s + Number(a.amount), 0);
  const resolvedCount = clientAccounts.filter(a => a.status === "Resolved").length;

  const feeAmount = feeType === "contingency"
    ? Math.round(totalCollected * (Number(feeRate) / 100))
    : feeType === "flat" ? Number(flatFee)
    : Math.round(totalCollected * (Number(feeRate) / 100)) + Number(flatFee);

  const tax = Math.round(feeAmount * 0); // 0% tax — customizable
  const total = feeAmount + tax;

  const lineItems = [
    feeType === "contingency" || feeType === "hybrid"
      ? { desc: `Contingency Fee (${feeRate}% of ${fmt(totalCollected)} collected)`, qty: 1, rate: Math.round(totalCollected * (Number(feeRate) / 100)), amount: Math.round(totalCollected * (Number(feeRate) / 100)) }
      : null,
    feeType === "flat" || feeType === "hybrid"
      ? { desc: "Flat Collection Fee", qty: 1, rate: Number(flatFee), amount: Number(flatFee) }
      : null,
  ].filter(Boolean);

  const buildInvoiceHTML = () => {
    const rows = lineItems.map(item => `
      <tr>
        <td style="padding:12px 16px;border-bottom:1px solid #e5e7eb">${item.desc}</td>
        <td style="padding:12px 16px;border-bottom:1px solid #e5e7eb;text-align:center">${item.qty}</td>
        <td style="padding:12px 16px;border-bottom:1px solid #e5e7eb;text-align:right">${fmt(item.rate)}</td>
        <td style="padding:12px 16px;border-bottom:1px solid #e5e7eb;text-align:right;font-weight:700">${fmt(item.amount)}</td>
      </tr>`).join("");

    const accountRows = clientAccounts.map(a => {
      const paid = (a.payments || []).reduce((s, p) => s + p.amount, 0);
      return `<tr><td style="padding:8px 12px;border-bottom:1px solid #f3f4f6;font-size:13px">${a.debtor}</td><td style="padding:8px 12px;border-bottom:1px solid #f3f4f6;text-align:right;font-size:13px">${fmt(a.amount)}</td><td style="padding:8px 12px;border-bottom:1px solid #f3f4f6;text-align:right;font-size:13px;color:#16a34a">${fmt(paid)}</td><td style="padding:8px 12px;border-bottom:1px solid #f3f4f6;text-align:center;font-size:12px"><span style="background:${(STATUS_COLORS[a.status]||"#6b7280")}22;color:${STATUS_COLORS[a.status]||"#6b7280"};padding:2px 8px;border-radius:4px">${a.status}</span></td></tr>`;
    }).join("");

    return `<!DOCTYPE html><html><head><meta charset="utf-8"/><title>Invoice ${invoiceNum}</title>

</head><body>

${notes ? `<div class="notes"><strong>Notes:</strong> ${notes}</div>` : ""}

// ── AI Agent View ──────────────────────────────────────────────────────────
function AIAgentView({ accounts, onUpdate }) {
  const [running, setRunning] = useState(false);
  const [logs, setLogs] = useState([]);
  const [activeId, setActiveId] = useState(null);
  const [activeStep, setActiveStep] = useState(-1);
  const [recovered, setRecovered] = useState(0);
  const [actionsRun, setActionsRun] = useState(0);
  const [queueLeft, setQueueLeft] = useState(accounts.length);
  const [rate, setRate] = useState(null);
  const [cycleComplete, setCycleComplete] = useState(false);
  const [autoSchedule, setAutoSchedule] = useState(true);
  const [focusMode, setFocusMode] = useState("all");

  const AGENT_ACTIONS = {
    "Active":       { label: "Call & Email", color: "#3b82f6", seq: ["Analyze debtor risk profile", "Draft personalized demand email", "Send via automated email channel", "Schedule call attempt at 9AM local", "Log all activity to account"] },
    "Pending":      { label: "First Contact", color: "#8b5cf6", seq: ["Send welcome notice & debt validation", "Log initial contact attempt", "Set 30-day validation timer", "Queue follow-up in 7 days", "Update status to Active"] },
    "Payment Plan": { label: "Plan Monitor", color: "#10b981", seq: ["Verify last payment received", "Send friendly payment reminder", "Confirm next payment date", "Update payment plan progress", "Alert if payment overdue"] },
    "Resolved":     { label: "Close & Archive", color: "#6b7280", seq: ["Generate resolution confirmation", "Send closing letter to debtor", "Notify client of recovery", "Archive all documents", "Update recovery metrics"] },
    "Cancelled":    { label: "Skip", color: "#6b7280", seq: ["Account cancelled — skipping"] },
  };

  const addLog = (text, type = "") => {
    const time = new Date().toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    setLogs(prev => [...prev, { time, text, type, id: Date.now() + Math.random() }]);
  };

  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  const focusFiltered = accounts.filter(a => {
    if (focusMode === "high") return a.priority === "High" && a.status !== "Resolved";
    if (focusMode === "promise") return (a.commsLog || []).some(c => c.outcome === "Promise to Pay");
    return a.status !== "Cancelled";
  });

  const runAgent = async () => {
    if (running) return;
    setRunning(true);
    setCycleComplete(false);
    setLogs([]);
    setRecovered(0);
    setActionsRun(0);
    setActiveId(null);
    setActiveStep(-1);

    let totalRecovered = 0;
    let totalActions = 0;

    addLog("🤖 SCR AI Agent activated — full collection cycle starting...", "info");
    await sleep(700);
    addLog(`📋 ${focusFiltered.length} accounts loaded. Prioritizing by risk & urgency...`, "info");
    await sleep(500);

    const sorted = [...focusFiltered].sort((a, b) => {
      const p = { High: 3, Medium: 2, Low: 1 };
      return (p[b.priority] || 0) - (p[a.priority] || 0);
    });

    for (let i = 0; i < sorted.length; i++) {
      const acc = sorted[i];
      const action = AGENT_ACTIONS[acc.status] || AGENT_ACTIONS["Pending"];
      setQueueLeft(sorted.length - i);
      setActiveId(acc.id);

      addLog(`⚡ Processing: ${acc.debtor} — ${acc.priority} priority, ${fmt(acc.amount)} outstanding`, "info");
      await sleep(400);

      for (let s = 0; s < action.seq.length; s++) {
        setActiveStep(s);
        addLog(`   ${acc.debtor}: ${action.seq[s]}`, "");
        await sleep(550);
        totalActions++;
        setActionsRun(totalActions);

        // Simulate recovery on payment-related steps
        if (action.seq[s].toLowerCase().includes("payment") || action.seq[s].toLowerCase().includes("email")) {
          const paid = (acc.payments || []).reduce((s, p) => s + p.amount, 0);
          const remaining = acc.amount - paid;
          if (remaining > 0 && acc.status !== "Resolved" && Math.random() > 0.5) {
            const est = Math.round(remaining * (0.05 + Math.random() * 0.15));
            totalRecovered += est;
            setRecovered(totalRecovered);
            addLog(`   💰 Payment response triggered: ${fmt(est)} expected from ${acc.debtor}`, "success");
          }
        }
      }

      // Log agent action to account comms log
      const agentEntry = {
        id: Date.now() + i,
        type: "Email",
        outcome: acc.status === "Resolved" ? "Payment Received" : "Spoke with Debtor",
        note: `AI Agent: ${action.label} sequence completed automatically.`,
        date: new Date().toISOString().slice(0, 10),
        time: new Date().toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" }),
        agent: "SCR AI Agent"
      };
      onUpdate(acc.id, { commsLog: [...(acc.commsLog || []), agentEntry] });

      addLog(`✅ ${acc.debtor}: Cycle complete. Follow-up scheduled.`, "success");
      await sleep(300);
    }

    const totalOwing = focusFiltered.reduce((s, a) => s + Math.max(0, a.amount - (a.payments || []).reduce((x, p) => x + p.amount, 0)), 0);
    const finalRate = totalOwing > 0 ? Math.round((totalRecovered / totalOwing) * 100) : 0;
    setRate(finalRate);
    setQueueLeft(0);
    setActiveId(null);
    setActiveStep(-1);
    setCycleComplete(true);

    addLog(`🎯 Full cycle complete! ${totalActions} actions executed across ${sorted.length} accounts.`, "success");
    addLog(`💰 Estimated recoveries triggered: ${fmt(totalRecovered)}`, "success");
    if (autoSchedule) addLog(`🕐 Next automated cycle scheduled in 24 hours.`, "info");
    setRunning(false);
  };

  const card = { background: "#111827", border: "1px solid #1f2937", borderRadius: 12, padding: 20, marginBottom: 16 };
  const logColors = { success: "#10b981", info: "#3b82f6", "": "#9ca3af" };

  return (
    <div style={{ flex: 1, overflowY: "auto", padding: 28, background: "#0d1117" }}>
      <div style={{ maxWidth: 1000, margin: "0 auto" }}>

        {/* Header */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 24 }}>
          <div>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
              <div style={{ width: 10, height: 10, borderRadius: "50%", background: running ? "#10b981" : "#374151", boxShadow: running ? "0 0 0 4px #10b98133" : "none", transition: "all .3s" }} />
              <div style={{ fontSize: 20, fontWeight: 700, color: "#f9fafb" }}>🤖 AI Collection Agent</div>
            </div>
            <div style={{ fontSize: 13, color: "#6b7280" }}>Autonomous debt recovery — runs your collection operation 24/7</div>
          </div>
          <span style={{ background: running ? "#10b98122" : cycleComplete ? "#3b82f622" : "#1f2937", color: running ? "#10b981" : cycleComplete ? "#93c5fd" : "#6b7280", border: `1px solid ${running ? "#10b98144" : "#374151"}`, borderRadius: 8, padding: "6px 14px", fontSize: 12, fontWeight: 700 }}>
            {running ? "⚡ RUNNING" : cycleComplete ? "✅ CYCLE COMPLETE" : "⏸ STANDBY"}
          </span>
        </div>

        {/* KPIs */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 14, marginBottom: 24 }}>
          {[
            { l: "Accounts in Queue", v: running ? queueLeft : focusFiltered.length, c: "#f9fafb", icon: "📋" },
            { l: "Actions Executed", v: actionsRun, c: "#3b82f6", icon: "⚡" },
            { l: "Est. Recoveries", v: fmt(recovered), c: "#10b981", icon: "💰" },
            { l: "Cycle Success Rate", v: rate !== null ? rate + "%" : "--", c: "#f59e0b", icon: "📈" },
          ].map(s => (
            <div key={s.l} style={card}>
              <div style={{ fontSize: 22, marginBottom: 8 }}>{s.icon}</div>
              <div style={{ fontSize: 10, color: "#6b7280", textTransform: "uppercase", letterSpacing: .7, marginBottom: 4 }}>{s.l}</div>
              <div style={{ fontSize: 22, fontWeight: 800, color: s.c }}>{s.v}</div>
            </div>
          ))}
        </div>

        {/* Config */}
        <div style={{ ...card, display: "flex", gap: 24, alignItems: "center", flexWrap: "wrap" }}>
          <div>
            <div style={{ fontSize: 12, color: "#9ca3af", marginBottom: 8, textTransform: "uppercase", letterSpacing: .6 }}>Focus Mode</div>
            <div style={{ display: "flex", gap: 6 }}>
              {[["all", "All Accounts"], ["high", "High Priority"], ["promise", "Promise to Pay"]].map(([v, l]) => (
                <button key={v} onClick={() => !running && setFocusMode(v)} style={{ padding: "6px 12px", borderRadius: 8, border: "none", cursor: running ? "not-allowed" : "pointer", fontSize: 12, fontWeight: 600, background: focusMode === v ? "#16a34a" : "#1f2937", color: focusMode === v ? "#fff" : "#9ca3af" }}>{l}</button>
              ))}
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ fontSize: 12, color: "#9ca3af", textTransform: "uppercase", letterSpacing: .6 }}>Auto-schedule (24h)</div>
            <div onClick={() => !running && setAutoSchedule(s => !s)} style={{ width: 44, height: 24, borderRadius: 12, background: autoSchedule ? "#16a34a" : "#374151", cursor: running ? "not-allowed" : "pointer", position: "relative", transition: "background .2s" }}>
              <div style={{ position: "absolute", top: 2, left: autoSchedule ? 22 : 2, width: 20, height: 20, borderRadius: "50%", background: "#fff", transition: "left .2s" }} />
            </div>
          </div>
          <div style={{ marginLeft: "auto" }}>
            <button onClick={runAgent} disabled={running} style={{ background: running ? "#374151" : "linear-gradient(135deg,#16a34a,#15803d)", color: running ? "#6b7280" : "#fff", border: "none", borderRadius: 10, padding: "12px 28px", fontSize: 14, fontWeight: 700, cursor: running ? "not-allowed" : "pointer", display: "flex", alignItems: "center", gap: 8 }}>
              {running ? <><span style={{ width: 14, height: 14, border: "2px solid #4b5563", borderTopColor: "#9ca3af", borderRadius: "50%", display: "inline-block", animation: "scr-spin .7s linear infinite" }} /> Running...</> : cycleComplete ? "↺ Run Again" : "▶ Run Full Collection Cycle"}
            </button>
          </div>
        </div>

        {/* Account queue */}
        <div style={{ fontSize: 11, color: "#6b7280", textTransform: "uppercase", letterSpacing: .7, marginBottom: 12 }}>Account Queue</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 24 }}>
          {focusFiltered.sort((a,b) => ({High:3,Medium:2,Low:1}[b.priority]||0) - ({High:3,Medium:2,Low:1}[a.priority]||0)).map(a => {
            const action = AGENT_ACTIONS[a.status] || AGENT_ACTIONS["Pending"];
            const paid = (a.payments || []).reduce((s, p) => s + p.amount, 0);
            const pct = Math.min(100, Math.round((paid / a.amount) * 100));
            const isActive = a.id === activeId;
            const priorityDot = { High: "#ef4444", Medium: "#f59e0b", Low: "#10b981" }[a.priority] || "#6b7280";
            return (
              <div key={a.id} style={{ background: "#111827", border: `1px solid ${isActive ? "#16a34a" : "#1f2937"}`, borderRadius: 12, padding: 16, transition: "border-color .3s" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
                  <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                    <div style={{ width: 8, height: 8, borderRadius: "50%", background: priorityDot, flexShrink: 0 }} />
                    <div>
                      <div style={{ fontWeight: 700, fontSize: 14, color: "#f9fafb" }}>{a.debtor}</div>
                      <div style={{ fontSize: 12, color: "#6b7280", marginTop: 2 }}>{a.priority} priority · {a.status}</div>
                    </div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontWeight: 700, color: "#fbbf24", fontSize: 13 }}>{fmt(a.amount)}</div>
                    <span style={{ background: action.color + "22", color: action.color, fontSize: 11, padding: "2px 8px", borderRadius: 4, fontWeight: 600 }}>{isActive ? "⚡ Processing..." : action.label}</span>
                  </div>
                </div>
                {isActive && activeStep >= 0 && (
                  <div style={{ background: "#16a34a18", border: "1px solid #16a34a33", borderRadius: 8, padding: "8px 12px", marginBottom: 8, fontSize: 12, color: "#4ade80" }}>
                    ⚡ {(AGENT_ACTIONS[a.status] || AGENT_ACTIONS["Pending"]).seq[activeStep]}
                  </div>
                )}
                <div style={{ height: 4, background: "#1f2937", borderRadius: 2, overflow: "hidden" }}>
                  <div style={{ height: "100%", width: pct + "%", background: action.color, borderRadius: 2 }} />
                </div>
              </div>
            );
          })}
        </div>

        {/* Activity Log */}
        <div style={{ fontSize: 11, color: "#6b7280", textTransform: "uppercase", letterSpacing: .7, marginBottom: 12 }}>Agent Activity Log</div>
        <div style={{ background: "#111827", border: "1px solid #1f2937", borderRadius: 12, padding: 18, maxHeight: 280, overflowY: "auto" }}>
          {logs.length === 0 ? (
            <div style={{ color: "#4b5563", fontSize: 13, textAlign: "center", padding: "16px 0" }}>No activity yet. Run a collection cycle to start.</div>
          ) : [...logs].reverse().map((l, i) => (
            <div key={l.id} style={{ display: "flex", gap: 12, padding: "6px 0", borderBottom: i < logs.length - 1 ? "1px solid #1f2937" : "none" }}>
              <span style={{ fontSize: 11, color: "#4b5563", flexShrink: 0, fontFamily: "monospace" }}>{l.time}</span>
              <span style={{ fontSize: 12, color: logColors[l.type] || "#9ca3af", lineHeight: 1.5 }}>{l.text}</span>
            </div>
          ))}
        </div>

        {/* What happens when live */}
        <div style={{ background: "linear-gradient(135deg,#0a1a0a,#111827)", border: "1px solid #16a34a44", borderRadius: 12, padding: 20, marginTop: 20 }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: "#4ade80", marginBottom: 12 }}>🚀 When Connected to Real Infrastructure</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            {[
              { icon: "📞", title: "Twilio", desc: "Agent places real calls & sends SMS to debtors automatically" },
              { icon: "📧", title: "SendGrid", desc: "Branded emails sent directly from info@spacecapitalrecovery.com" },
              { icon: "🕐", title: "Scheduled Runs", desc: "Agent runs every 24 hours without you opening the app" },
              { icon: "📊", title: "Real Recoveries", desc: "Payments logged automatically when debtors respond" },
            ].map(s => (
              <div key={s.title} style={{ background: "#0d1117", borderRadius: 8, padding: "12px 14px", display: "flex", gap: 10 }}>
                <span style={{ fontSize: 20, flexShrink: 0 }}>{s.icon}</span>
                <div>
                  <div style={{ fontSize: 12, fontWeight: 700, color: "#d1d5db" }}>{s.title}</div>
                  <div style={{ fontSize: 11, color: "#6b7280", marginTop: 2, lineHeight: 1.5 }}>{s.desc}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
      <style>{`@keyframes scr-spin { to { transform: rotate(360deg); } }`}</style>
    </div>
  );
}

        {/* Client Portal */}
        {activeTab === "portal" && (
          <div>
            <div style={card}>
              <div style={{ fontSize: 14, fontWeight: 700, color: "#d1d5db", marginBottom: 20 }}>Portal Settings</div>
              {[
                ["requireDocsOnSubmit", "Require document upload when submitting a debt"],
                ["allowClientPaymentView", "Allow clients to see payment history"],
                ["showRecoveryRate", "Show recovery rate on client dashboard"],
              ].map(([key, lbl]) => (
                <div key={key} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 0", borderBottom: "1px solid #1f2937" }}>
                  <span style={{ fontSize: 13, color: "#d1d5db" }}>{lbl}</span>
                  <div onClick={() => set(key, !settings[key])} style={{ width: 44, height: 24, borderRadius: 12, background: settings[key] ? "#16a34a" : "#374151", cursor: "pointer", position: "relative", transition: "background .2s" }}>
                    <div style={{ position: "absolute", top: 2, left: settings[key] ? 22 : 2, width: 20, height: 20, borderRadius: "50%", background: "#fff", transition: "left .2s" }} />
                  </div>
                </div>
              ))}
            </div>
            <div style={card}>
              <div style={{ fontSize: 14, fontWeight: 700, color: "#d1d5db", marginBottom: 12 }}>Client Portal Welcome Message</div>
              <textarea value={settings.clientPortalMessage} onChange={e => set("clientPortalMessage", e.target.value)} rows={4} style={{ ...inp, resize: "none", fontFamily: "Georgia,serif", lineHeight: 1.6 }} />
              <div style={{ fontSize: 11, color: "#6b7280", marginTop: 8 }}>Shown to clients when they log into the portal.</div>
            </div>
          </div>
        )}

        <button onClick={saveSettings} style={{ width: "100%", background: saved ? "#15803d" : "#16a34a", color: "#fff", border: "none", borderRadius: 10, padding: 13, fontSize: 14, fontWeight: 700, cursor: "pointer" }}>
          {saved ? "✅ All Settings Saved!" : "💾 Save All Settings"}
        </button>
      </div>
    </div>
  );
}

// ── Client Management ──────────────────────────────────────────────────────
function ClientManagement({ clients, setClients, accounts }) {
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);
  const [showConfirmDelete, setShowConfirmDelete] = useState(null);
  const [form, setForm] = useState({ name: "", email: "", password: "", phone: "", industry: "", address: "", contactName: "", status: "Active" });
  const [search, setSearch] = useState("");
  const [copied, setCopied] = useState(null);

  const INDUSTRIES = ["Financial Services", "Healthcare", "Retail / E-commerce", "Real Estate", "Auto / Transportation", "Utilities", "Telecommunications", "Legal Services", "Construction", "Other"];

  const inp = { width: "100%", background: "#0d1117", border: "1px solid #374151", borderRadius: 8, padding: "9px 12px", color: "#f9fafb", fontSize: 13, outline: "none", boxSizing: "border-box" };

  const clientList = Object.values(clients).filter(c => !search || c.name.toLowerCase().includes(search.toLowerCase()) || c.email.toLowerCase().includes(search.toLowerCase()));

  const openAdd = () => {
    setEditId(null);
    setForm({ name: "", email: "", password: "", phone: "", industry: "", address: "", contactName: "", status: "Active" });
    setShowForm(true);
  };

  const openEdit = (c) => {
    setEditId(c.id);
    setForm({ ...c });
    setShowForm(true);
  };

  const save = () => {
    if (!form.name || !form.email) return;
    if (editId) {
      setClients(prev => ({ ...prev, [editId]: { ...prev[editId], ...form } }));
    } else {
      const newId = "c" + Date.now();
      setClients(prev => ({ ...prev, [newId]: { ...form, id: newId, joined: new Date().toISOString().slice(0, 10) } }));
    }
    setShowForm(false);
  };

  const deleteClient = (id) => {
    setClients(prev => { const next = { ...prev }; delete next[id]; return next; });
    setShowConfirmDelete(null);
  };

  const copyPassword = (id, pwd) => {
    navigator.clipboard.writeText(pwd);
    setCopied(id);
    setTimeout(() => setCopied(null), 2000);
  };

  const getClientStats = (id) => {
    const clientAccts = accounts.filter(a => a.clientId === id);
    const totalOwed = clientAccts.reduce((s, a) => s + Number(a.amount), 0);
    const collected = clientAccts.reduce((s, a) => s + (a.payments || []).reduce((x, p) => x + p.amount, 0), 0);
    return { count: clientAccts.length, totalOwed, collected };
  };

  return (
    <div style={{ flex: 1, overflowY: "auto", padding: 28, background: "#0d1117" }}>
      <div style={{ maxWidth: 1000, margin: "0 auto" }}>
        {/* Header */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 24 }}>
          <div>
            <div style={{ fontSize: 20, fontWeight: 700 }}>👥 Client Management</div>
            <div style={{ fontSize: 13, color: "#6b7280", marginTop: 4 }}>Add, edit, and manage your collection clients</div>
          </div>
          <button onClick={openAdd} style={{ background: "#16a34a", color: "#fff", border: "none", borderRadius: 8, padding: "10px 20px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>+ Add Client</button>
        </div>

        {/* Search */}
        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search clients by name or email..." style={{ ...inp, marginBottom: 20, fontSize: 14 }} />

        {/* Stats bar */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 14, marginBottom: 24 }}>
          {[
            { l: "Total Clients", v: Object.keys(clients).length, c: "#f9fafb", icon: "👥" },
            { l: "Active Clients", v: Object.values(clients).filter(c => c.status === "Active").length, c: "#10b981", icon: "✅" },
            { l: "Total Accounts", v: accounts.length, c: "#3b82f6", icon: "📋" },
          ].map(s => (
            <div key={s.l} style={{ background: "#111827", border: "1px solid #1f2937", borderRadius: 12, padding: 16, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div>
                <div style={{ fontSize: 10, color: "#6b7280", textTransform: "uppercase", letterSpacing: .7, marginBottom: 6 }}>{s.l}</div>
                <div style={{ fontSize: 24, fontWeight: 800, color: s.c }}>{s.v}</div>
              </div>
              <span style={{ fontSize: 28 }}>{s.icon}</span>
            </div>
          ))}
        </div>

        {/* Client cards */}
        {clientList.length === 0 && <div style={{ textAlign: "center", color: "#6b7280", padding: 40, background: "#111827", borderRadius: 12, border: "1px solid #1f2937" }}>No clients found.</div>}
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {clientList.map(c => {
            const stats = getClientStats(c.id);
            return (
              <div key={c.id} style={{ background: "#111827", border: "1px solid #1f2937", borderRadius: 12, padding: 20 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 16 }}>
                  <div style={{ display: "flex", gap: 14, alignItems: "center" }}>
                    <div style={{ width: 48, height: 48, borderRadius: 12, background: "#16a34a22", border: "1px solid #16a34a44", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22, flexShrink: 0 }}>
                      {c.name.charAt(0)}
                    </div>
                    <div>
                      <div style={{ fontSize: 16, fontWeight: 700, color: "#f9fafb" }}>{c.name}</div>
                      <div style={{ fontSize: 13, color: "#9ca3af", marginTop: 2 }}>{c.contactName} · {c.industry}</div>
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    <span style={{ background: c.status === "Active" ? "#10b98122" : "#6b728022", color: c.status === "Active" ? "#10b981" : "#9ca3af", fontSize: 11, padding: "2px 10px", borderRadius: 4, fontWeight: 600 }}>{c.status}</span>
                    <button onClick={() => openEdit(c)} style={{ background: "#1f2937", color: "#9ca3af", border: "none", borderRadius: 6, padding: "6px 10px", cursor: "pointer", fontSize: 12 }}>✏️ Edit</button>
                    <button onClick={() => setShowConfirmDelete(c.id)} style={{ background: "#7f1d1d22", color: "#f87171", border: "none", borderRadius: 6, padding: "6px 10px", cursor: "pointer", fontSize: 12 }}>🗑️</button>
                  </div>
                </div>

                <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 12, marginBottom: 16 }}>
                  {[
                    { l: "Accounts", v: stats.count },
                    { l: "Total Debt", v: fmt(stats.totalOwed), c: "#fbbf24" },
                    { l: "Collected", v: fmt(stats.collected), c: "#10b981" },
                    { l: "Joined", v: c.joined || "—" },
                  ].map(s => (
                    <div key={s.l} style={{ background: "#0d1117", borderRadius: 8, padding: "10px 12px" }}>
                      <div style={{ fontSize: 10, color: "#6b7280", textTransform: "uppercase", letterSpacing: .6, marginBottom: 4 }}>{s.l}</div>
                      <div style={{ fontSize: 14, fontWeight: 700, color: s.c || "#f9fafb" }}>{s.v}</div>
                    </div>
                  ))}
                </div>

                <div style={{ display: "flex", gap: 20, fontSize: 13, color: "#9ca3af", flexWrap: "wrap" }}>
                  <span>📧 {c.email}</span>
                  {c.phone && <span>📞 {c.phone}</span>}
                  {c.address && <span>📍 {c.address}</span>}
                  <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    🔑 Portal password:
                    <span style={{ background: "#0d1117", padding: "1px 8px", borderRadius: 4, fontFamily: "monospace", color: "#d1d5db" }}>{c.password}</span>
                    <button onClick={() => copyPassword(c.id, c.password)} style={{ background: copied === c.id ? "#15803d" : "#1f2937", color: copied === c.id ? "#fff" : "#9ca3af", border: "none", borderRadius: 4, padding: "2px 8px", cursor: "pointer", fontSize: 11 }}>
                      {copied === c.id ? "✓ Copied" : "Copy"}
                    </button>
                  </span>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Add/Edit Modal */}
      {showForm && (
        <div style={{ position: "fixed", inset: 0, background: "#000c", zIndex: 2000, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <div style={{ background: "#111827", border: "1px solid #1f2937", borderRadius: 14, width: "100%", maxWidth: 580, maxHeight: "90vh", overflowY: "auto" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "18px 24px", borderBottom: "1px solid #1f2937" }}>
              <div style={{ fontWeight: 700, fontSize: 16 }}>{editId ? "✏️ Edit Client" : "➕ Add New Client"}</div>
              <button onClick={() => setShowForm(false)} style={{ background: "#1f2937", color: "#9ca3af", border: "none", borderRadius: 8, width: 32, height: 32, cursor: "pointer", fontSize: 16 }}>✕</button>
            </div>
            <div style={{ padding: 24 }}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                {[["Company Name *", "name", "text", "Acme Corp"], ["Contact Name", "contactName", "text", "Jane Doe"], ["Email Address *", "email", "email", "jane@acme.com"], ["Phone", "phone", "tel", "555-000-0000"], ["Portal Password", "password", "text", "secure123"], ["Address", "address", "text", "123 Main St, City, ST"]].map(([lbl, key, type, ph]) => (
                  <div key={key} style={{ gridColumn: key === "name" || key === "address" ? "1 / -1" : "auto" }}>
                    <div style={{ fontSize: 12, color: "#9ca3af", marginBottom: 6 }}>{lbl}</div>
                    <input type={type} value={form[key] || ""} onChange={e => setForm(f => ({ ...f, [key]: e.target.value }))} placeholder={ph} style={inp} />
                  </div>
                ))}
                <div>
                  <div style={{ fontSize: 12, color: "#9ca3af", marginBottom: 6 }}>Industry</div>
                  <select value={form.industry || ""} onChange={e => setForm(f => ({ ...f, industry: e.target.value }))} style={inp}>
                    <option value="">Select...</option>
                    {INDUSTRIES.map(i => <option key={i}>{i}</option>)}
                  </select>
                </div>
                <div>
                  <div style={{ fontSize: 12, color: "#9ca3af", marginBottom: 6 }}>Status</div>
                  <select value={form.status || "Active"} onChange={e => setForm(f => ({ ...f, status: e.target.value }))} style={inp}>
                    <option>Active</option>
                    <option>Inactive</option>
                    <option>Suspended</option>
                  </select>
                </div>
              </div>
              <div style={{ marginTop: 20, display: "flex", gap: 10 }}>
                <button onClick={save} disabled={!form.name || !form.email} style={{ flex: 1, background: form.name && form.email ? "#16a34a" : "#1f2937", color: form.name && form.email ? "#fff" : "#6b7280", border: "none", borderRadius: 8, padding: 11, fontSize: 14, fontWeight: 700, cursor: form.name && form.email ? "pointer" : "not-allowed" }}>
                  {editId ? "Save Changes" : "Add Client"}
                </button>
                <button onClick={() => setShowForm(false)} style={{ background: "#1f2937", color: "#9ca3af", border: "1px solid #374151", borderRadius: 8, padding: "11px 20px", cursor: "pointer" }}>Cancel</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Delete confirm */}
      {showConfirmDelete && (
        <div style={{ position: "fixed", inset: 0, background: "#000c", zIndex: 2000, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <div style={{ background: "#111827", border: "1px solid #ef444444", borderRadius: 14, width: "100%", maxWidth: 420, padding: 28, textAlign: "center" }}>
            <div style={{ fontSize: 40, marginBottom: 16 }}>⚠️</div>
            <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 8 }}>Remove Client?</div>
            <div style={{ fontSize: 13, color: "#9ca3af", marginBottom: 24 }}>
              This will remove <strong style={{ color: "#f9fafb" }}>{clients[showConfirmDelete]?.name}</strong> from your client list. Their accounts will remain in the system.
            </div>
            <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
              <button onClick={() => deleteClient(showConfirmDelete)} style={{ background: "#dc2626", color: "#fff", border: "none", borderRadius: 8, padding: "10px 24px", fontWeight: 700, cursor: "pointer" }}>Remove Client</button>
              <button onClick={() => setShowConfirmDelete(null)} style={{ background: "#1f2937", color: "#9ca3af", border: "1px solid #374151", borderRadius: 8, padding: "10px 20px", cursor: "pointer" }}>Cancel</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Task Manager ───────────────────────────────────────────────────────────
const TEAM = ["SCR Team", "Alex R.", "Maria T.", "James K.", "Priya S."];
const INIT_TASKS = [
  { id: 1, title: "Follow up with Marcus Webb — no contact in 7 days", priority: "High", status: "To Do", assignee: "Alex R.", due: "2026-06-10", account: "Marcus Webb", category: "Follow Up", created: "2026-06-01" },
  { id: 2, title: "Send payment plan agreement to Tanya Romero", priority: "Medium", status: "In Progress", assignee: "Maria T.", due: "2026-06-08", account: "Tanya Romero", category: "Documentation", created: "2026-06-02" },
  { id: 3, title: "Research UrbanBuild LLC assets for potential action", priority: "High", status: "To Do", assignee: "James K.", due: "2026-06-12", account: "UrbanBuild LLC", category: "Skip Tracing", created: "2026-06-03" },
  { id: 4, title: "Renew collection license — Pennsylvania", priority: "High", status: "To Do", assignee: "SCR Team", due: "2026-06-15", account: "", category: "Compliance", created: "2026-06-01" },
  { id: 5, title: "Update client portal with Q2 recovery report", priority: "Low", status: "Done", assignee: "Priya S.", due: "2026-06-05", account: "", category: "Admin", created: "2026-05-28" },
];

function TaskManager({ accounts }) {
  const [tasks, setTasks] = useState(INIT_TASKS);
  const [filter, setFilter] = useState("all");
  const [filterPriority, setFilterPriority] = useState("all");
  const [showForm, setShowForm] = useState(false);
  const [editTask, setEditTask] = useState(null);
  const [form, setForm] = useState({ title: "", priority: "Medium", assignee: "SCR Team", due: "", account: "", category: "Follow Up", notes: "" });

  const CATEGORIES = ["Follow Up", "Skip Tracing", "Documentation", "Compliance", "Legal", "Admin", "Client Communication", "Other"];
  const PRIORITIES = { High: "#ef4444", Medium: "#f59e0b", Low: "#10b981" };
  const STATUS_LIST = ["To Do", "In Progress", "Review", "Done"];
  const STATUS_COLORS_T = { "To Do": "#6b7280", "In Progress": "#3b82f6", "Review": "#f59e0b", "Done": "#10b981" };

  const today = new Date().toISOString().slice(0, 10);

  const filtered = tasks.filter(t => {
    const mStatus = filter === "all" || t.status === filter;
    const mPriority = filterPriority === "all" || t.priority === filterPriority;
    return mStatus && mPriority;
  });

  const todo = tasks.filter(t => t.status === "To Do").length;
  const inprog = tasks.filter(t => t.status === "In Progress").length;
  const done = tasks.filter(t => t.status === "Done").length;
  const overdue = tasks.filter(t => t.due && t.due < today && t.status !== "Done").length;

  const openForm = (task = null) => {
    if (task) { setEditTask(task.id); setForm({ ...task }); }
    else { setEditTask(null); setForm({ title: "", priority: "Medium", assignee: "SCR Team", due: "", account: "", category: "Follow Up", notes: "" }); }
    setShowForm(true);
  };

  const saveTask = () => {
    if (!form.title) return;
    if (editTask) {
      setTasks(ts => ts.map(t => t.id === editTask ? { ...t, ...form } : t));
    } else {
      setTasks(ts => [...ts, { ...form, id: Date.now(), status: "To Do", created: today }]);
    }
    setShowForm(false);
  };

  const updateStatus = (id, status) => setTasks(ts => ts.map(t => t.id === id ? { ...t, status } : t));
  const deleteTask = (id) => setTasks(ts => ts.filter(t => t.id !== id));

  const inp = { width: "100%", background: "#0d1117", border: "1px solid #374151", borderRadius: 8, padding: "9px 12px", color: "#f9fafb", fontSize: 13, outline: "none", boxSizing: "border-box" };

  return (
    <div style={{ flex: 1, overflowY: "auto", padding: 28, background: "#0d1117" }}>
      <div style={{ maxWidth: 1000, margin: "0 auto" }}>
        {/* Header */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 24 }}>
          <div>
            <div style={{ fontSize: 20, fontWeight: 700 }}>✅ Task Manager</div>
            <div style={{ fontSize: 13, color: "#6b7280", marginTop: 4 }}>Team to-do list & follow-up tracker</div>
          </div>
          <button onClick={() => openForm()} style={{ background: "#16a34a", color: "#fff", border: "none", borderRadius: 8, padding: "10px 20px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>+ New Task</button>
        </div>

        {/* KPI row */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 14, marginBottom: 24 }}>
          {[
            { l: "To Do", v: todo, c: "#6b7280", icon: "📋" },
            { l: "In Progress", v: inprog, c: "#3b82f6", icon: "⚡" },
            { l: "Done", v: done, c: "#10b981", icon: "✅" },
            { l: "Overdue", v: overdue, c: "#ef4444", icon: "🔴" },
          ].map(s => (
            <div key={s.l} style={{ background: "#111827", border: "1px solid #1f2937", borderRadius: 12, padding: 16 }}>
              <div style={{ fontSize: 22, marginBottom: 6 }}>{s.icon}</div>
              <div style={{ fontSize: 10, color: "#6b7280", textTransform: "uppercase", letterSpacing: .7, marginBottom: 4 }}>{s.l}</div>
              <div style={{ fontSize: 24, fontWeight: 800, color: s.c }}>{s.v}</div>
            </div>
          ))}
        </div>

        {/* Filters */}
        <div style={{ display: "flex", gap: 8, marginBottom: 20, flexWrap: "wrap" }}>
          <div style={{ display: "flex", gap: 4 }}>
            {["all", ...STATUS_LIST].map(s => (
              <button key={s} onClick={() => setFilter(s)} style={{ padding: "6px 12px", borderRadius: 7, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 600, background: filter === s ? (STATUS_COLORS_T[s] || "#16a34a") + "33" : "#1f2937", color: filter === s ? (STATUS_COLORS_T[s] || "#16a34a") : "#9ca3af" }}>
                {s === "all" ? "All" : s}
              </button>
            ))}
          </div>
          <div style={{ display: "flex", gap: 4, marginLeft: 8 }}>
            {["all", "High", "Medium", "Low"].map(p => (
              <button key={p} onClick={() => setFilterPriority(p)} style={{ padding: "6px 12px", borderRadius: 7, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 600, background: filterPriority === p ? (PRIORITIES[p] || "#16a34a") + "33" : "#1f2937", color: filterPriority === p ? (PRIORITIES[p] || "#16a34a") : "#9ca3af" }}>
                {p === "all" ? "All Priority" : p}
              </button>
            ))}
          </div>
        </div>

        {/* Task list */}
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {filtered.length === 0 && <div style={{ textAlign: "center", color: "#6b7280", padding: 40, background: "#111827", borderRadius: 12, border: "1px solid #1f2937" }}>No tasks found.</div>}
          {filtered.map(task => {
            const isOverdue = task.due && task.due < today && task.status !== "Done";
            return (
              <div key={task.id} style={{ background: "#111827", border: `1px solid ${isOverdue ? "#ef444444" : "#1f2937"}`, borderRadius: 12, padding: 18, display: "flex", gap: 14, alignItems: "flex-start" }}>
                {/* Priority dot */}
                <div style={{ width: 12, height: 12, borderRadius: "50%", background: PRIORITIES[task.priority] || "#6b7280", flexShrink: 0, marginTop: 4 }} />

                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12, marginBottom: 8 }}>
                    <div style={{ fontSize: 14, fontWeight: 700, color: task.status === "Done" ? "#6b7280" : "#f9fafb", textDecoration: task.status === "Done" ? "line-through" : "none", lineHeight: 1.4 }}>{task.title}</div>
                    <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                      <button onClick={() => openForm(task)} style={{ background: "#1f2937", color: "#9ca3af", border: "none", borderRadius: 6, padding: "4px 8px", cursor: "pointer", fontSize: 12 }}>✏️</button>
                      <button onClick={() => deleteTask(task.id)} style={{ background: "#7f1d1d22", color: "#f87171", border: "none", borderRadius: 6, padding: "4px 8px", cursor: "pointer", fontSize: 12 }}>🗑️</button>
                    </div>
                  </div>

                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginBottom: 10 }}>
                    <span style={{ background: (PRIORITIES[task.priority] || "#6b7280") + "22", color: PRIORITIES[task.priority] || "#6b7280", fontSize: 11, padding: "2px 8px", borderRadius: 4, fontWeight: 600 }}>{task.priority}</span>
                    <span style={{ background: "#1f2937", color: "#9ca3af", fontSize: 11, padding: "2px 8px", borderRadius: 4 }}>{task.category}</span>
                    {task.account && <span style={{ background: "#3b82f622", color: "#93c5fd", fontSize: 11, padding: "2px 8px", borderRadius: 4 }}>📋 {task.account}</span>}
                    <span style={{ fontSize: 11, color: "#6b7280" }}>👤 {task.assignee}</span>
                    {task.due && <span style={{ fontSize: 11, color: isOverdue ? "#f87171" : "#6b7280", fontWeight: isOverdue ? 700 : 400 }}>{isOverdue ? "⚠️ Overdue:" : "📅"} {task.due}</span>}
                  </div>

                  {/* Status buttons */}
                  <div style={{ display: "flex", gap: 5 }}>
                    {STATUS_LIST.map(s => (
                      <button key={s} onClick={() => updateStatus(task.id, s)} style={{ padding: "4px 10px", borderRadius: 6, border: "none", cursor: "pointer", fontSize: 11, fontWeight: 600, background: task.status === s ? STATUS_COLORS_T[s] + "33" : "#1f2937", color: task.status === s ? STATUS_COLORS_T[s] : "#6b7280" }}>{s}</button>
                    ))}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* New/Edit Task Modal */}
      {showForm && (
        <div style={{ position: "fixed", inset: 0, background: "#000c", zIndex: 2000, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <div style={{ background: "#111827", border: "1px solid #1f2937", borderRadius: 14, width: "100%", maxWidth: 560, maxHeight: "90vh", overflowY: "auto" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "18px 24px", borderBottom: "1px solid #1f2937" }}>
              <div style={{ fontWeight: 700, fontSize: 16 }}>{editTask ? "✏️ Edit Task" : "➕ New Task"}</div>
              <button onClick={() => setShowForm(false)} style={{ background: "#1f2937", color: "#9ca3af", border: "none", borderRadius: 8, width: 32, height: 32, cursor: "pointer", fontSize: 16 }}>✕</button>
            </div>
            <div style={{ padding: 24 }}>
              <div style={{ marginBottom: 14 }}>
                <div style={{ fontSize: 12, color: "#9ca3af", marginBottom: 6 }}>Task Title *</div>
                <input value={form.title} onChange={e => setForm(f => ({ ...f, title: e.target.value }))} placeholder="What needs to be done?" style={inp} />
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 14 }}>
                <div>
                  <div style={{ fontSize: 12, color: "#9ca3af", marginBottom: 6 }}>Priority</div>
                  <select value={form.priority} onChange={e => setForm(f => ({ ...f, priority: e.target.value }))} style={inp}>
                    <option>High</option><option>Medium</option><option>Low</option>
                  </select>
                </div>
                <div>
                  <div style={{ fontSize: 12, color: "#9ca3af", marginBottom: 6 }}>Category</div>
                  <select value={form.category} onChange={e => setForm(f => ({ ...f, category: e.target.value }))} style={inp}>
                    {CATEGORIES.map(c => <option key={c}>{c}</option>)}
                  </select>
                </div>
                <div>
                  <div style={{ fontSize: 12, color: "#9ca3af", marginBottom: 6 }}>Assign To</div>
                  <select value={form.assignee} onChange={e => setForm(f => ({ ...f, assignee: e.target.value }))} style={inp}>
                    {TEAM.map(t => <option key={t}>{t}</option>)}
                  </select>
                </div>
                <div>
                  <div style={{ fontSize: 12, color: "#9ca3af", marginBottom: 6 }}>Due Date</div>
                  <input type="date" value={form.due} onChange={e => setForm(f => ({ ...f, due: e.target.value }))} style={inp} />
                </div>
              </div>
              <div style={{ marginBottom: 14 }}>
                <div style={{ fontSize: 12, color: "#9ca3af", marginBottom: 6 }}>Linked Account (optional)</div>
                <select value={form.account} onChange={e => setForm(f => ({ ...f, account: e.target.value }))} style={inp}>
                  <option value="">None</option>
                  {accounts.map(a => <option key={a.id} value={a.debtor}>{a.debtor}</option>)}
                </select>
              </div>
              <div style={{ marginBottom: 20 }}>
                <div style={{ fontSize: 12, color: "#9ca3af", marginBottom: 6 }}>Notes</div>
                <textarea value={form.notes || ""} onChange={e => setForm(f => ({ ...f, notes: e.target.value }))} rows={3} placeholder="Any additional details..." style={{ ...inp, resize: "none", fontFamily: "Georgia,serif" }} />
              </div>
              <div style={{ display: "flex", gap: 10 }}>
                <button onClick={saveTask} disabled={!form.title} style={{ flex: 1, background: form.title ? "#16a34a" : "#1f2937", color: form.title ? "#fff" : "#6b7280", border: "none", borderRadius: 8, padding: 11, fontSize: 14, fontWeight: 700, cursor: form.title ? "pointer" : "not-allowed" }}>
                  {editTask ? "Save Changes" : "Create Task"}
                </button>
                <button onClick={() => setShowForm(false)} style={{ background: "#1f2937", color: "#9ca3af", border: "1px solid #374151", borderRadius: 8, padding: "11px 20px", cursor: "pointer" }}>Cancel</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Compliance & Audit Log ─────────────────────────────────────────────────
function ComplianceView({ accounts }) {
  const [activeTab, setActiveTab] = useState("checklist");
  const [checkState, setCheckState] = useState({});

  const FDCPA_CHECKS = [
    { id: "c1", category: "Communication", rule: "Only contact debtors between 8am–9pm local time", risk: "High" },
    { id: "c2", category: "Communication", rule: "Do not contact debtors at their workplace if prohibited", risk: "High" },
    { id: "c3", category: "Communication", rule: "Honor written cease communication requests within 5 days", risk: "High" },
    { id: "c4", category: "Disclosure", rule: "Identify yourself as a debt collector in every communication", risk: "High" },
    { id: "c5", category: "Disclosure", rule: "Disclose the amount of the debt and name of the creditor", risk: "High" },
    { id: "c6", category: "Disclosure", rule: "Provide 30-day validation notice on initial contact", risk: "High" },
    { id: "c7", category: "Validation", rule: "Cease collection if debtor disputes debt in writing within 30 days", risk: "High" },
    { id: "c8", category: "Validation", rule: "Provide written verification of debt upon written request", risk: "Medium" },
    { id: "c9", category: "Prohibited", rule: "Do not use false, deceptive, or misleading representations", risk: "High" },
    { id: "c10", category: "Prohibited", rule: "Do not threaten legal action you cannot or will not take", risk: "High" },
    { id: "c11", category: "Prohibited", rule: "Do not use obscene or profane language", risk: "Medium" },
    { id: "c12", category: "Prohibited", rule: "Do not publish debtor names on a bad debt list", risk: "High" },
    { id: "c13", category: "Records", rule: "Maintain records of all collection communications for 7 years", risk: "Medium" },
    { id: "c14", category: "Records", rule: "Document all payment arrangements in writing", risk: "Medium" },
    { id: "c15", category: "Records", rule: "Log all debtor disputes and responses", risk: "High" },
    { id: "c16", category: "Licensing", rule: "Ensure collection licenses are current for all operating states", risk: "High" },
    { id: "c17", category: "Licensing", rule: "Maintain surety bond as required by state law", risk: "High" },
    { id: "c18", category: "Data", rule: "Handle debtor data in accordance with FCRA requirements", risk: "High" },
    { id: "c19", category: "Data", rule: "Properly dispose of sensitive consumer information", risk: "Medium" },
    { id: "c20", category: "Training", rule: "Ensure all collectors receive annual FDCPA compliance training", risk: "Medium" },
  ];

  const categories = [...new Set(FDCPA_CHECKS.map(c => c.category))];
  const checked = FDCPA_CHECKS.filter(c => checkState[c.id] === "compliant").length;
  const issues = FDCPA_CHECKS.filter(c => checkState[c.id] === "issue").length;
  const pending = FDCPA_CHECKS.length - checked - issues;
  const score = Math.round((checked / FDCPA_CHECKS.length) * 100);

  // Build audit log from all account activities
  const auditLog = [];
  accounts.forEach(a => {
    auditLog.push({ date: a.submitted, time: "09:00 AM", action: "Account Created", detail: `New account for ${a.debtor} (${fmt(a.amount)}) submitted by ${CLIENTS[a.clientId]?.name}`, type: "account", icon: "📋" });
    (a.payments || []).forEach(p => {
      auditLog.push({ date: p.date, time: "10:00 AM", action: "Payment Logged", detail: `Payment of ${fmt(p.amount)} received from ${a.debtor}`, type: "payment", icon: "💰" });
    });
    (a.commsLog || []).forEach(c => {
      auditLog.push({ date: c.date, time: c.time, action: `${c.type} Attempt`, detail: `${c.type} with ${a.debtor} — Outcome: ${c.outcome}${c.note ? ". " + c.note : ""}`, type: "comms", icon: c.type === "Call" ? "📞" : c.type === "Email" ? "📧" : "💬" });
    });
    if (a.paymentPlan) {
      auditLog.push({ date: a.paymentPlan.createdDate || a.submitted, time: "11:00 AM", action: "Payment Plan Created", detail: `Payment plan set for ${a.debtor}: ${fmt(a.paymentPlan.monthly)}/mo over ${a.paymentPlan.months} months`, type: "plan", icon: "📅" });
    }
    if (a.status === "Resolved") {
      auditLog.push({ date: a.submitted, time: "03:00 PM", action: "Account Resolved", detail: `${a.debtor}'s account fully resolved`, type: "resolved", icon: "✅" });
    }
  });
  auditLog.sort((a, b) => new Date(b.date) - new Date(a.date));

  const typeColors = { account: "#3b82f6", payment: "#10b981", comms: "#8b5cf6", plan: "#f59e0b", resolved: "#10b981" };

  return (
    <div style={{ flex: 1, overflowY: "auto", padding: 28, background: "#0d1117" }}>
      <div style={{ maxWidth: 1000, margin: "0 auto" }}>
        <div style={{ marginBottom: 24 }}>
          <div style={{ fontSize: 20, fontWeight: 700 }}>🛡️ Compliance & Audit Log</div>
          <div style={{ fontSize: 13, color: "#6b7280", marginTop: 4 }}>FDCPA compliance tracking and full activity audit trail</div>
        </div>

        {/* Score bar */}
        <div style={{ background: "#111827", border: "1px solid #1f2937", borderRadius: 12, padding: 20, marginBottom: 24, display: "flex", alignItems: "center", gap: 24 }}>
          <div style={{ width: 80, height: 80, borderRadius: "50%", border: `4px solid ${score >= 80 ? "#10b981" : score >= 50 ? "#f59e0b" : "#ef4444"}`, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
            <div style={{ fontSize: 22, fontWeight: 800, color: score >= 80 ? "#10b981" : score >= 50 ? "#f59e0b" : "#ef4444" }}>{score}%</div>
            <div style={{ fontSize: 9, color: "#6b7280", textTransform: "uppercase" }}>Score</div>
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
              <span style={{ fontSize: 14, fontWeight: 700 }}>FDCPA Compliance Score</span>
              <span style={{ fontSize: 13, color: score >= 80 ? "#10b981" : score >= 50 ? "#f59e0b" : "#ef4444", fontWeight: 700 }}>
                {score >= 80 ? "✅ Good Standing" : score >= 50 ? "⚠️ Needs Attention" : "🔴 High Risk"}
              </span>
            </div>
            <div style={{ height: 8, background: "#1f2937", borderRadius: 4, overflow: "hidden", marginBottom: 10 }}>
              <div style={{ height: "100%", width: score + "%", background: score >= 80 ? "linear-gradient(90deg,#10b981,#4ade80)" : score >= 50 ? "#f59e0b" : "#ef4444", borderRadius: 4, transition: "width .5s" }} />
            </div>
            <div style={{ display: "flex", gap: 20, fontSize: 12 }}>
              <span style={{ color: "#10b981" }}>✓ {checked} Compliant</span>
              <span style={{ color: "#ef4444" }}>✗ {issues} Issues</span>
              <span style={{ color: "#6b7280" }}>○ {pending} Pending Review</span>
            </div>
          </div>
        </div>

        {/* Tabs */}
        <div style={{ display: "flex", gap: 4, marginBottom: 20 }}>
          {[["checklist", "📋 FDCPA Checklist"], ["audit", "📜 Audit Log"], ["summary", "📊 Summary"]].map(([t, l]) => (
            <button key={t} onClick={() => setActiveTab(t)} style={{ padding: "8px 18px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 13, fontWeight: 600, background: activeTab === t ? "#16a34a" : "#1f2937", color: activeTab === t ? "#fff" : "#9ca3af" }}>{l}</button>
          ))}
        </div>

        {/* FDCPA Checklist */}
        {activeTab === "checklist" && (
          <div>
            {categories.map(cat => (
              <div key={cat} style={{ background: "#111827", border: "1px solid #1f2937", borderRadius: 12, padding: 20, marginBottom: 16 }}>
                <div style={{ fontSize: 13, fontWeight: 700, color: "#d1d5db", marginBottom: 14 }}>{cat}</div>
                {FDCPA_CHECKS.filter(c => c.category === cat).map(c => {
                  const state = checkState[c.id] || "pending";
                  return (
                    <div key={c.id} style={{ display: "flex", gap: 12, alignItems: "center", padding: "10px 0", borderBottom: "1px solid #1f2937" }}>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 13, color: state === "compliant" ? "#d1d5db" : state === "issue" ? "#f87171" : "#9ca3af", lineHeight: 1.4 }}>{c.rule}</div>
                        <span style={{ fontSize: 10, color: c.risk === "High" ? "#ef4444" : "#f59e0b", background: c.risk === "High" ? "#ef444422" : "#f59e0b22", padding: "1px 6px", borderRadius: 4, fontWeight: 600, marginTop: 4, display: "inline-block" }}>{c.risk} Risk</span>
                      </div>
                      <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                        {[["compliant", "✓", "#10b981"], ["issue", "✗", "#ef4444"], ["pending", "○", "#6b7280"]].map(([val, lbl, col]) => (
                          <button key={val} onClick={() => setCheckState(s => ({ ...s, [c.id]: val }))} style={{ width: 30, height: 30, borderRadius: 6, border: `2px solid ${state === val ? col : "#374151"}`, background: state === val ? col + "22" : "transparent", color: state === val ? col : "#6b7280", cursor: "pointer", fontSize: 13, fontWeight: 700 }}>{lbl}</button>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            ))}
          </div>
        )}

        {/* Audit Log */}
        {activeTab === "audit" && (
          <div style={{ background: "#111827", border: "1px solid #1f2937", borderRadius: 12, padding: 20 }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: "#d1d5db", marginBottom: 16 }}>Activity Audit Trail ({auditLog.length} entries)</div>
            {auditLog.length === 0 ? (
              <div style={{ textAlign: "center", color: "#6b7280", padding: 32 }}>No activity logged yet.</div>
            ) : auditLog.map((entry, i) => (
              <div key={i} style={{ display: "flex", gap: 14, padding: "12px 0", borderBottom: i < auditLog.length - 1 ? "1px solid #1f2937" : "none" }}>
                <div style={{ width: 36, height: 36, borderRadius: "50%", background: (typeColors[entry.type] || "#6b7280") + "22", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, flexShrink: 0 }}>{entry.icon}</div>
                <div style={{ flex: 1 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 3 }}>
                    <span style={{ fontSize: 13, fontWeight: 700, color: "#f9fafb" }}>{entry.action}</span>
                    <span style={{ fontSize: 11, color: "#6b7280", flexShrink: 0, marginLeft: 12 }}>{entry.date} · {entry.time}</span>
                  </div>
                  <div style={{ fontSize: 12, color: "#9ca3af", lineHeight: 1.5 }}>{entry.detail}</div>

                <div style={{ width: 4, borderRadius: 2, background: typeColors[entry.type] || "#6b7280", flexShrink: 0, alignSelf: "stretch" }} />

        {/* Summary */}
        {activeTab === "summary" && (
          <div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 16, marginBottom: 20 }}>
              {[
                { l: "Total Audit Entries", v: auditLog.length, c: "#f9fafb", icon: "📜" },
                { l: "Payment Records", v: auditLog.filter(e => e.type === "payment").length, c: "#10b981", icon: "💰" },
                { l: "Comm. Attempts Logged", v: auditLog.filter(e => e.type === "comms").length, c: "#8b5cf6", icon: "📞" },
                { l: "Accounts Resolved", v: accounts.filter(a => a.status === "Resolved").length, c: "#10b981", icon: "✅" },
                { l: "Payment Plans Active", v: accounts.filter(a => a.paymentPlan).length, c: "#3b82f6", icon: "📅" },
                { l: "Compliance Score", v: score + "%", c: score >= 80 ? "#10b981" : "#f59e0b", icon: "🛡️" },
              ].map(s => (
                <div key={s.l} style={{ background: "#111827", border: "1px solid #1f2937", borderRadius: 12, padding: 18 }}>
                  <div style={{ fontSize: 24, marginBottom: 8 }}>{s.icon}</div>
                  <div style={{ fontSize: 10, color: "#6b7280", textTransform: "uppercase", letterSpacing: .7, marginBottom: 6 }}>{s.l}</div>
                  <div style={{ fontSize: 24, fontWeight: 800, color: s.c }}>{s.v}</div>
                </div>
              ))}
            </div>

            {/* Legal disclaimer */}
            <div style={{ background: "#111827", border: "1px solid #374151", borderRadius: 12, padding: 20 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: "#d1d5db", marginBottom: 12 }}>⚖️ Legal Disclaimer & Important Notes</div>
              {[
                "Space Capital Recovery is not a law firm and does not provide legal advice.",
                "This compliance checklist is a general guide only and does not constitute legal compliance certification.",
                "FDCPA requirements vary by state — consult a licensed attorney for jurisdiction-specific guidance.",
                "Debt collection licenses must be maintained in all states where collection activity occurs.",
                "All collection activities must comply with the Fair Debt Collection Practices Act (FDCPA), Fair Credit Reporting Act (FCRA), and applicable state laws.",
                "Consumer disputes must be handled according to FDCPA Section 809 requirements.",

    </div>
  );
