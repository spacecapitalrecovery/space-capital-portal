// ── Document Vault ─────────────────────────────────────────────────────────
function DocumentVault({ account, onUpdate }) {
  const [dragOver, setDragOver] = useState(false);
  const [docTag, setDocTag] = useState("General");
  const docs = account.documents || [];

  const DOC_TYPES = {
    "pdf": { icon: "📄", color: "#ef4444" },
    "doc": { icon: "📝", color: "#3b82f6" },
    "docx": { icon: "📝", color: "#3b82f6" },
    "jpg": { icon: "🖼️", color: "#f59e0b" },
    "jpeg": { icon: "🖼️", color: "#f59e0b" },
    "png": { icon: "🖼️", color: "#f59e0b" },
    "xls": { icon: "📊", color: "#10b981" },
    "xlsx": { icon: "📊", color: "#10b981" },
    "txt": { icon: "📃", color: "#9ca3af" },
  };

  const TAGS = ["General", "Contract", "Demand Letter", "Payment Proof", "Dispute Letter", "Court Filing", "ID Verification", "Skip Trace", "Other"];

  const getFileIcon = (name) => {
    const ext = name.split(".").pop().toLowerCase();
    return DOC_TYPES[ext]?.icon || "📎";
  };
  const getFileColor = (name) => {
    const ext = name.split(".").pop().toLowerCase();
    return DOC_TYPES[ext]?.color || "#6b7280";
  };

  const formatSize = (bytes) => {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  };

  const handleFiles = (files) => {
    const newDocs = Array.from(files).map(file => {
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = (e) => resolve({
          id: Date.now() + Math.random(),
          name: file.name,
          size: file.size,
          type: file.type,
          tag: docTag,
          date: new Date().toISOString().slice(0, 10),
          uploadedBy: "SCR Team",
          dataUrl: e.target.result
        });
        reader.readAsDataURL(file);
      });
    });
    Promise.all(newDocs).then(resolved => {
      onUpdate([...docs, ...resolved]);
    });
  };

  const deleteDoc = (id) => onUpdate(docs.filter(d => d.id !== id));

  const downloadDoc = (doc) => {
    const a = document.createElement("a");
    a.href = doc.dataUrl;
    a.download = doc.name;
    a.click();
  };

  const tagColors = { "Contract": "#3b82f6", "Demand Letter": "#ef4444", "Payment Proof": "#10b981", "Dispute Letter": "#f59e0b", "Court Filing": "#8b5cf6", "ID Verification": "#06b6d4", "Skip Trace": "#f97316", "General": "#6b7280", "Other": "#6b7280" };

  return (
    <div style={{ background: "#111827", border: "1px solid #1f2937", borderRadius: 12, padding: 20, marginBottom: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: "#d1d5db" }}>📎 Document Vault</div>
        <span style={{ background: "#1f2937", color: "#9ca3af", fontSize: 12, padding: "2px 10px", borderRadius: 6 }}>{docs.length} file{docs.length !== 1 ? "s" : ""}</span>
      </div>

      {/* Tag selector */}
      <div style={{ marginBottom: 14 }}>
        <div style={{ fontSize: 11, color: "#6b7280", marginBottom: 7, textTransform: "uppercase", letterSpacing: .6 }}>Document Category</div>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {TAGS.map(t => (
            <button key={t} onClick={() => setDocTag(t)} style={{ padding: "4px 10px", borderRadius: 6, border: "none", cursor: "pointer", fontSize: 11, fontWeight: 600, background: docTag === t ? (tagColors[t] || "#6b7280") + "33" : "#1f2937", color: docTag === t ? (tagColors[t] || "#9ca3af") : "#9ca3af" }}>{t}</button>
          ))}
        </div>
      </div>

      {/* Drop zone */}
      <label
        onDragOver={e => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={() => setDragOver(false)}
        onDrop={e => { e.preventDefault(); setDragOver(false); handleFiles(e.dataTransfer.files); }}
        style={{ display: "block", border: `2px dashed ${dragOver ? "#16a34a" : "#374151"}`, borderRadius: 10, padding: "24px 16px", textAlign: "center", cursor: "pointer", background: dragOver ? "#16a34a11" : "#0d1117", transition: "all .2s", marginBottom: 16 }}
      >
        <input type="file" multiple onChange={e => handleFiles(e.target.files)} style={{ display: "none" }} />
        <div style={{ fontSize: 28, marginBottom: 8 }}>📁</div>
        <div style={{ fontSize: 13, color: "#9ca3af", marginBottom: 4 }}>
          <strong style={{ color: "#f9fafb" }}>Click to upload</strong> or drag & drop
        </div>
        <div style={{ fontSize: 11, color: "#6b7280" }}>PDF, Word, Excel, Images, Text — any file type</div>

// ── Notifications ──────────────────────────────────────────────────────────
function generateAlerts(accounts) {
  const alerts = [];
  const now = new Date();
  const todayStr = now.toISOString().slice(0, 10);

  accounts.forEach(a => {
    const daysSince = Math.floor((now - new Date(a.submitted)) / (1000 * 60 * 60 * 24));
    const paid = (a.payments || []).reduce((s, p) => s + p.amount, 0);
    const remaining = a.amount - paid;
    const hasComms = (a.commsLog || []).length > 0;
    const lastComm = a.commsLog?.length > 0 ? a.commsLog[a.commsLog.length - 1] : null;
    const daysSinceComm = lastComm ? Math.floor((now - new Date(lastComm.date)) / (1000 * 60 * 60 * 24)) : daysSince;

    // High priority with no contact
    if (a.priority === "High" && a.status === "Active" && !hasComms) {
      alerts.push({ id: `hp-${a.id}`, icon: "🔴", color: "#ef4444", read: false, message: `High priority: ${a.debtor} (${fmt(a.amount)}) has no contact attempts logged yet.`, time: "Now" });
    }
    // No contact in 7+ days
    if (a.status === "Active" && daysSinceComm >= 7 && a.status !== "Resolved") {
      alerts.push({ id: `nc-${a.id}`, icon: "⏰", color: "#f59e0b", read: false, message: `${a.debtor} has not been contacted in ${daysSinceComm} days. Follow up recommended.`, time: `${daysSinceComm}d ago` });
    }
    // New account (submitted today or yesterday)
    if (daysSince <= 1) {
      alerts.push({ id: `new-${a.id}`, icon: "🆕", color: "#3b82f6", read: false, message: `New account submitted: ${a.debtor} — ${fmt(a.amount)} from ${CLIENTS[a.clientId]?.name}.`, time: "Today" });
    }
    // Payment received
    if ((a.payments || []).length > 0) {
      const lastPay = a.payments[a.payments.length - 1];
      alerts.push({ id: `pay-${a.id}`, icon: "💰", color: "#10b981", read: true, message: `Payment of ${fmt(lastPay.amount)} received from ${a.debtor} on ${lastPay.date}.`, time: lastPay.date });
    }
    // Account resolved
    if (a.status === "Resolved") {
      alerts.push({ id: `res-${a.id}`, icon: "✅", color: "#10b981", read: true, message: `${a.debtor}'s account has been fully resolved. ${fmt(paid)} collected.`, time: "Recent" });
    }
    // Pending too long (10+ days)
    if (a.status === "Pending" && daysSince >= 10) {
      alerts.push({ id: `pend-${a.id}`, icon: "⚠️", color: "#f59e0b", read: false, message: `${a.debtor} has been Pending for ${daysSince} days. Consider activating or escalating.`, time: `${daysSince}d` });
    }
    // Promise to pay follow up
    if (lastComm?.outcome === "Promise to Pay") {
      alerts.push({ id: `ptp-${a.id}`, icon: "🤝", color: "#8b5cf6", read: false, message: `${a.debtor} promised to pay on ${lastComm.date}. Follow up if payment not received.`, time: lastComm.date });
    }
  });

  // Sort: unread first, then by priority
  return alerts.sort((a, b) => (a.read ? 1 : 0) - (b.read ? 1 : 0)).slice(0, 20);
}

// ── Score History ──────────────────────────────────────────────────────────
function ScoreHistory({ account }) {
  const history = account.scoreHistory || [];
  const [expanded, setExpanded] = useState(false);

  if (history.length === 0) return (
    <div style={{ background: "#111827", border: "1px solid #1f2937", borderRadius: 12, padding: 16, marginBottom: 16 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, color: "#6b7280", fontSize: 13 }}>
        <span style={{ fontSize: 16 }}>📊</span>
        <span>No score history yet — run an AI Analysis to start tracking risk over time.</span>
      </div>
    </div>
  );

  const latest = history[history.length - 1];
  const previous = history.length > 1 ? history[history.length - 2] : null;
  const trend = previous ? latest.score - previous.score : null;
  const showAll = expanded ? history : history.slice(-5);

  return (
    <div style={{ background: "#111827", border: "1px solid #1f2937", borderRadius: 12, padding: 20, marginBottom: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 18 }}>📊</span>
          <div>
            <div style={{ fontSize: 13, fontWeight: 700, color: "#d1d5db" }}>Risk Score History</div>
            <div style={{ fontSize: 11, color: "#6b7280" }}>{history.length} assessment{history.length > 1 ? "s" : ""} recorded</div>
          </div>
        </div>
        {/* Trend indicator */}
        {trend !== null && (
          <div style={{ display: "flex", alignItems: "center", gap: 6, background: trend > 0 ? "#10b98122" : trend < 0 ? "#ef444422" : "#6b728022", border: `1px solid ${trend > 0 ? "#10b98144" : trend < 0 ? "#ef444444" : "#6b728044"}`, borderRadius: 8, padding: "6px 12px" }}>
            <span style={{ fontSize: 16 }}>{trend > 0 ? "📈" : trend < 0 ? "📉" : "➡️"}</span>
            <div>
              <div style={{ fontSize: 12, fontWeight: 700, color: trend > 0 ? "#10b981" : trend < 0 ? "#f87171" : "#9ca3af" }}>
                {trend > 0 ? "+" : ""}{trend} pts
              </div>
              <div style={{ fontSize: 10, color: "#6b7280" }}>vs last scan</div>
            </div>
          </div>
        )}
      </div>

      {/* Score timeline chart */}
      {history.length > 1 && (
        <div style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 11, color: "#6b7280", textTransform: "uppercase", letterSpacing: .6, marginBottom: 8 }}>Score Trend</div>
          <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height: 60, background: "#0d1117", borderRadius: 8, padding: "8px 12px" }}>
            {history.slice(-10).map((h, i) => {
              const pct = (h.score / 100) * 44;
              return (
                <div key={h.id} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 3 }}>
                  <div style={{ fontSize: 9, color: "#6b7280" }}>{h.score}</div>
                  <div style={{ width: "100%", height: Math.max(4, pct), background: h.ratingColor || "#16a34a", borderRadius: "3px 3px 0 0", opacity: i === history.slice(-10).length - 1 ? 1 : 0.6 }} />
                  <div style={{ fontSize: 8, color: "#4b5563", whiteSpace: "nowrap", overflow: "hidden" }}>{h.date.slice(5)}</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* History entries */}
      <div style={{ fontSize: 11, color: "#6b7280", textTransform: "uppercase", letterSpacing: .6, marginBottom: 10 }}>Assessment Log</div>
      {[...showAll].reverse().map((h, i) => (
        <div key={h.id} style={{ display: "flex", gap: 12, alignItems: "center", padding: "10px 0", borderBottom: i < showAll.length - 1 ? "1px solid #1f2937" : "none" }}>
          {/* Score circle */}
          <div style={{ width: 44, height: 44, borderRadius: "50%", border: `2px solid ${h.ratingColor}`, background: "#0d1117", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
            <div style={{ fontSize: 14, fontWeight: 800, color: h.ratingColor, lineHeight: 1 }}>{h.score}</div>
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 3 }}>
              <span style={{ background: h.ratingColor + "22", color: h.ratingColor, fontSize: 11, padding: "1px 7px", borderRadius: 4, fontWeight: 600 }}>{h.rating}</span>
              <span style={{ background: "#1f2937", color: "#9ca3af", fontSize: 11, padding: "1px 7px", borderRadius: 4 }}>{h.status}</span>
              <span style={{ background: "#10b98122", color: "#10b981", fontSize: 11, padding: "1px 7px", borderRadius: 4 }}>Est. {h.estimatedRecovery}</span>
              {i === 0 && <span style={{ background: "#3b82f622", color: "#93c5fd", fontSize: 10, padding: "1px 7px", borderRadius: 4, fontWeight: 700 }}>LATEST</span>}
            </div>
            <div style={{ fontSize: 11, color: "#6b7280" }}>
              {h.date} at {h.time} · Collected: {fmt(h.amountPaid || 0)}
            </div>
          </div>
        </div>
      ))}

      {history.length > 5 && (
        <button onClick={() => setExpanded(e => !e)} style={{ width: "100%", background: "transparent", color: "#6b7280", border: "1px solid #374151", borderRadius: 8, padding: "8px", fontSize: 12, cursor: "pointer", marginTop: 10 }}>
          {expanded ? "Show less ↑" : `Show all ${history.length} assessments ↓`}
        </button>
      )}
    </div>
  );
}

        <div style={{ width: 360, borderRight: "1px solid #1f2937", display: "flex", flexDirection: "column", flexShrink: 0 }}>
          <div style={{ padding: "14px 16px", borderBottom: "1px solid #1f2937" }}>
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search debtor..." style={{ width: "100%", background: "#0d1117", border: "1px solid #374151", borderRadius: 8, padding: "8px 12px", color: "#f9fafb", fontSize: 13, outline: "none", boxSizing: "border-box", marginBottom: 10 }} />
            <div style={{ display: "flex", gap: 5, flexWrap: "wrap" }}>
              {["all", "Active", "Pending", "Payment Plan", "Resolved"].map(f => (
                <button key={f} onClick={() => setFilter(f)} style={{ padding: "4px 10px", borderRadius: 6, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 600, background: filter === f ? (STATUS_COLORS[f] || "#16a34a") + "33" : "#1f2937", color: filter === f ? (STATUS_COLORS[f] || "#16a34a") : "#9ca3af" }}>{f === "all" ? "All" : f}</button>
              ))}
            </div>
          </div>
          <div style={{ overflowY: "auto", flex: 1 }}>
            {filtered.map(a => {
              const p = (a.payments || []).reduce((s, x) => s + x.amount, 0);
              const pct = Math.min(100, Math.round((p / a.amount) * 100));
              return (
                <div key={a.id} onClick={() => { setSel(a.id); setAiResult(null); }} style={{ padding: "14px 16px", borderBottom: "1px solid #1f2937", cursor: "pointer", background: sel === a.id ? "#1f2937" : "transparent" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                    <div>
                      <div style={{ fontWeight: 700, fontSize: 14 }}>{a.debtor}</div>
                      <div style={{ fontSize: 11, color: "#6b7280", marginTop: 2 }}>{CLIENTS[a.clientId]?.name} · {a.submitted}</div>
                    </div>
                    <div style={{ textAlign: "right" }}>
                      <div style={{ fontWeight: 700, color: "#fbbf24", fontSize: 13 }}>{fmt(a.amount)}</div>
                      <span style={{ background: STATUS_COLORS[a.status] + "22", color: STATUS_COLORS[a.status], fontSize: 10, padding: "1px 7px", borderRadius: 4, fontWeight: 600 }}>{a.status}</span>
                    </div>
                  </div>
                  {pct > 0 && <div style={{ height: 3, background: "#1f2937", borderRadius: 2 }}><div style={{ height: "100%", width: pct + "%", background: "#16a34a", borderRadius: 2 }} /></div>}
                </div>
              );
            })}
          </div>
        </div>

        {/* Detail panel */}
        <div style={{ flex: 1, overflowY: "auto", padding: 24 }}>
          {!acc ? (
            <div style={{ height: "100%", display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 12, color: "#4b5563" }}>
              <div style={{ fontSize: 40 }}>👈</div>
              <div style={{ fontSize: 15 }}>Click an account on the left</div>
            </div>
          ) : (
            <div>
              {/* Header */}
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 20 }}>
                <div>
                  <h2 style={{ margin: 0, fontSize: 22 }}>{acc.debtor}</h2>
                  <div style={{ color: "#9ca3af", fontSize: 13, marginTop: 4 }}>{CLIENTS[acc.clientId]?.name} · {acc.submitted}</div>
                </div>
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <button onClick={() => setEmailModal(true)} style={{ background: "#f59e0b22", color: "#f59e0b", border: "1px solid #f59e0b44", borderRadius: 8, padding: "6px 14px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>✉️ Send Email</button>
                  <span style={{ background: STATUS_COLORS[acc.status] + "22", color: STATUS_COLORS[acc.status], border: `1px solid ${STATUS_COLORS[acc.status]}44`, borderRadius: 6, padding: "3px 10px", fontSize: 12, fontWeight: 600 }}>{acc.status}</span>
                </div>
              </div>

              {/* Email Composer Modal */}
              {emailModal && <EmailComposer account={acc} client={CLIENTS[acc.clientId]} paid={paid} onClose={() => setEmailModal(false)} />}

              {/* Financials */}
              <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 12, marginBottom: 20 }}>
                {[{ l: "Total Owed", v: fmt(acc.amount), c: "#fbbf24" }, { l: "Collected", v: fmt(paid), c: "#10b981" }, { l: "Remaining", v: fmt(Math.max(0, acc.amount - paid)), c: acc.amount - paid <= 0 ? "#10b981" : "#f9fafb" }].map(s => (
                  <div key={s.l} style={{ background: "#111827", border: "1px solid #1f2937", borderRadius: 10, padding: 14 }}>
                    <div style={{ fontSize: 10, color: "#6b7280", textTransform: "uppercase", letterSpacing: .7, marginBottom: 6 }}>{s.l}</div>
                    <div style={{ fontSize: 22, fontWeight: 700, color: s.c }}>{s.v}</div>
                  </div>
                ))}
              </div>

              {/* AI PANEL */}
              <div style={{ background: "linear-gradient(135deg,#0a1a0a,#111827)", border: "2px solid #16a34a", borderRadius: 12, padding: 20, marginBottom: 20 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <span style={{ fontSize: 28 }}>🤖</span>
                    <div>
                      <div style={{ fontSize: 14, fontWeight: 700, color: "#4ade80" }}>AI ANALYSIS</div>
                      <div style={{ fontSize: 11, color: "#6b7280" }}>Powered by Claude</div>
                    </div>
                  </div>
                  <button onClick={runAI} disabled={aiLoading} style={{ background: aiLoading ? "#374151" : "#16a34a", color: "#fff", border: "none", borderRadius: 8, padding: "10px 22px", fontSize: 14, fontWeight: 700, cursor: aiLoading ? "not-allowed" : "pointer", minWidth: 140 }}>
                    {aiLoading ? "⏳ Analyzing..." : aiResult ? "↺ Re-analyze" : "✦ Analyze Debtor"}
                  </button>
                </div>

                {aiResult && (
                  <div style={{ marginTop: 20 }}>
                    <div style={{ display: "flex", gap: 14, alignItems: "center", marginBottom: 16 }}>
                      <div style={{ width: 72, height: 72, borderRadius: "50%", border: `3px solid ${aiResult.ratingColor}`, background: "#0d1117", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                        <div style={{ fontSize: 22, fontWeight: 800, color: aiResult.ratingColor }}>{aiResult.score}</div>
                        <div style={{ fontSize: 9, color: "#6b7280", textTransform: "uppercase" }}>Score</div>
                      </div>
                      <div>
                        <div style={{ display: "inline-block", background: aiResult.ratingColor + "22", color: aiResult.ratingColor, border: `1px solid ${aiResult.ratingColor}44`, borderRadius: 6, padding: "3px 10px", fontSize: 12, fontWeight: 700, marginBottom: 8 }}>{aiResult.rating}</div>
                        <div style={{ fontSize: 13, color: "#d1d5db", lineHeight: 1.6 }}>{aiResult.summary}</div>
                      </div>
                    </div>
                    <div style={{ display: "flex", justifyContent: "space-between", background: "#0d1117", borderRadius: 8, padding: "10px 14px", marginBottom: 12 }}>
                      <span style={{ fontSize: 12, color: "#6b7280", textTransform: "uppercase", letterSpacing: .6 }}>Estimated Recovery</span>
                      <span style={{ fontSize: 18, fontWeight: 800, color: "#4ade80" }}>{aiResult.estimatedRecovery}</span>
                    </div>
                    <div style={{ background: "#16a34a18", border: "1px solid #16a34a44", borderRadius: 8, padding: "10px 14px", marginBottom: 12 }}>
                      <div style={{ fontSize: 10, color: "#4ade80", textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>⚡ Next Action</div>
                      <div style={{ fontSize: 13, color: "#e5e7eb" }}>{aiResult.nextAction}</div>
                    </div>
                    <div style={{ fontSize: 10, color: "#6b7280", textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>Collection Tactics</div>
                    {aiResult.tactics.map((t, i) => (
                      <div key={i} style={{ display: "flex", gap: 10, marginBottom: 8, alignItems: "flex-start" }}>
                        <span style={{ background: "#16a34a", color: "#fff", borderRadius: "50%", width: 20, height: 20, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 700, flexShrink: 0 }}>{i + 1}</span>
                        <span style={{ fontSize: 13, color: "#d1d5db", lineHeight: 1.5 }}>{t}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* Payment Plan Calculator */}
              <PaymentPlanCalc
                account={acc}
                paid={paid}
                months={planMonths} setMonths={setPlanMonths}
                down={planDown} setDown={setPlanDown}
                discount={planDiscount} setDiscount={setPlanDiscount}
                saved={planSaved}
                onSave={savePlan}
              />

              {/* Score History */}
              <ScoreHistory account={acc} />

              {/* Status */}
              <div style={card}>
                <div style={{ fontSize: 13, fontWeight: 700, color: "#d1d5db", marginBottom: 12 }}>Update Status</div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  {["Active", "Pending", "Payment Plan", "Resolved", "Cancelled"].map(s => (
                    <button key={s} onClick={() => onUpdate(acc.id, { status: s })} style={{ padding: "7px 14px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 600, background: acc.status === s ? "#16a34a" : "#1f2937", color: acc.status === s ? "#fff" : "#9ca3af" }}>{s}</button>
                  ))}
                </div>
              </div>

              {/* Payment */}
              <div style={card}>
                <div style={{ fontSize: 13, fontWeight: 700, color: "#d1d5db", marginBottom: 12 }}>Log Payment</div>
                <div style={{ display: "flex", gap: 10 }}>
                  <input value={pay} onChange={e => setPay(e.target.value)} placeholder="Amount ($)" style={inp} />
                  <button onClick={logPayment} style={{ background: "#16a34a", color: "#fff", border: "none", borderRadius: 8, padding: "8px 18px", fontWeight: 700, cursor: "pointer" }}>Log</button>
                </div>
                {(acc.payments || []).map((p, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: "1px solid #1f2937", fontSize: 13 }}>
                    <span style={{ color: "#9ca3af" }}>{p.date}</span>
                    <span style={{ color: "#10b981", fontWeight: 700 }}>+{fmt(p.amount)}</span>
                  </div>
                ))}
              </div>

              {/* Notes */}
              <div style={card}>
                <div style={{ fontSize: 13, fontWeight: 700, color: "#d1d5db", marginBottom: 12 }}>Case Notes</div>
                <div style={{ background: "#0d1117", borderRadius: 8, padding: 12, fontSize: 13, color: "#d1d5db", marginBottom: 12, minHeight: 36 }}>{acc.notes || <span style={{ color: "#4b5563" }}>No notes yet.</span>}</div>
                <div style={{ display: "flex", gap: 10 }}>
                  <input value={note} onChange={e => setNote(e.target.value)} placeholder="Add a note..." style={inp} />
                  <button onClick={saveNote} style={{ background: "#1f2937", color: "#d1d5db", border: "1px solid #374151", borderRadius: 8, padding: "8px 16px", cursor: "pointer", fontWeight: 600 }}>Save</button>
                </div>
              </div>

              {/* Communication Log */}
              <div style={{ background: "#111827", border: "1px solid #1f2937", borderRadius: 12, padding: 18, marginBottom: 16 }}>
                <div style={{ fontSize: 13, fontWeight: 700, color: "#d1d5db", marginBottom: 16 }}>📞 Communication Log</div>

                {/* Log new entry */}
                <div style={{ background: "#0d1117", borderRadius: 10, padding: 16, marginBottom: 16 }}>
                  <div style={{ fontSize: 11, color: "#6b7280", textTransform: "uppercase", letterSpacing: .7, marginBottom: 12 }}>Log New Contact</div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
                    {/* Type */}
                    <div>
                      <div style={{ fontSize: 11, color: "#9ca3af", marginBottom: 5 }}>Type</div>
                      <div style={{ display: "flex", gap: 6 }}>
                        {["📞 Call", "📧 Email", "💬 Text"].map(t => {
                          const val = t.split(" ")[1];
                          return (
                            <button key={val} onClick={() => setCommType(val)} style={{ flex: 1, padding: "6px 4px", borderRadius: 6, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 600, background: commType === val ? "#3b82f6" : "#1f2937", color: commType === val ? "#fff" : "#9ca3af" }}>{t}</button>
                          );
                        })}
                      </div>
                    </div>
                    {/* Outcome */}
                    <div>
                      <div style={{ fontSize: 11, color: "#9ca3af", marginBottom: 5 }}>Outcome</div>
                      <select value={commOutcome} onChange={e => setCommOutcome(e.target.value)} style={{ width: "100%", background: "#111827", border: "1px solid #374151", borderRadius: 6, padding: "6px 10px", color: "#f9fafb", fontSize: 12, outline: "none" }}>
                        {["No Answer", "Left Voicemail", "Spoke with Debtor", "Promise to Pay", "Refused to Pay", "Wrong Number", "Disputed Debt", "Payment Received"].map(o => <option key={o}>{o}</option>)}
                      </select>
                    </div>
                  </div>
                  {/* Notes */}
                  <div style={{ marginBottom: 10 }}>
                    <div style={{ fontSize: 11, color: "#9ca3af", marginBottom: 5 }}>Notes (optional)</div>
                    <input value={commNote} onChange={e => setCommNote(e.target.value)} placeholder="What happened on this contact attempt?" style={{ width: "100%", background: "#111827", border: "1px solid #374151", borderRadius: 6, padding: "7px 10px", color: "#f9fafb", fontSize: 13, outline: "none", boxSizing: "border-box" }} />
                  </div>
                  <button onClick={logComm} style={{ background: "#3b82f6", color: "#fff", border: "none", borderRadius: 8, padding: "8px 18px", fontWeight: 700, fontSize: 13, cursor: "pointer" }}>+ Log Contact</button>
                </div>

                {/* Log history */}
                {(acc.commsLog || []).length === 0 ? (
                  <div style={{ textAlign: "center", color: "#4b5563", fontSize: 13, padding: "16px 0" }}>No contact attempts logged yet.</div>
                ) : (
                  <div>
                    <div style={{ fontSize: 11, color: "#6b7280", textTransform: "uppercase", letterSpacing: .7, marginBottom: 10 }}>History ({(acc.commsLog || []).length} entries)</div>
                    {[...(acc.commsLog || [])].reverse().map((c, i) => {
                      const typeIcon = { Call: "📞", Email: "📧", Text: "💬" }[c.type] || "📋";
                      const outcomeColor = {
                        "Promise to Pay": "#10b981", "Payment Received": "#10b981",
                        "Refused to Pay": "#ef4444", "Disputed Debt": "#f59e0b",
                        "Spoke with Debtor": "#3b82f6", "Left Voicemail": "#8b5cf6",
                        "No Answer": "#6b7280", "Wrong Number": "#6b7280"
                      }[c.outcome] || "#6b7280";
                      return (
                        <div key={c.id} style={{ display: "flex", gap: 12, padding: "12px 0", borderBottom: i < (acc.commsLog || []).length - 1 ? "1px solid #1f2937" : "none" }}>
                          <div style={{ width: 36, height: 36, borderRadius: "50%", background: "#1f2937", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, flexShrink: 0 }}>{typeIcon}</div>
                          <div style={{ flex: 1 }}>
                            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                <span style={{ fontSize: 13, fontWeight: 700, color: "#f9fafb" }}>{c.type}</span>
                                <span style={{ background: outcomeColor + "22", color: outcomeColor, fontSize: 11, padding: "1px 7px", borderRadius: 4, fontWeight: 600 }}>{c.outcome}</span>
                              </div>
                              <span style={{ fontSize: 11, color: "#6b7280" }}>{c.date} {c.time}</span>
                            </div>
                            {c.note && <div style={{ fontSize: 12, color: "#9ca3af", lineHeight: 1.5 }}>{c.note}</div>}
                            <div style={{ fontSize: 11, color: "#4b5563", marginTop: 3 }}>Logged by {c.agent}</div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              {/* Document Uploads */}
              <DocumentVault account={acc} onUpdate={(docs) => onUpdate(acc.id, { documents: docs })} />
            </div>
          )}
        </div>
      </div>
      </> /* end accounts view */}
    </div>
  );
}

function App() {
  const [session, setSession] = useState(null);
  const [onboarding, setOnboarding] = useState(false);
  const [accounts, setAccounts] = useState(ACCOUNTS);
  const [clients, setClients] = useState(INIT_CLIENTS);
  const [nextId, setNextId] = useState(10);
  const [dark, setDark] = useState(true);

  const addAccount = (d) => { setAccounts(p => [...p, { ...d, id: nextId }]); setNextId(n => n + 1); };
  const updateAccount = (id, ch) => setAccounts(p => p.map(a => a.id === id ? { ...a, ...ch } : a));
  const handleLogin = (session) => setSession(session);

  const T = dark ? {
    bg: "#0d1117", surface: "#111827", border: "#1f2937", text: "#f9fafb",
    textSub: "#9ca3af", textMuted: "#6b7280", input: "#0d1117", inputBorder: "#374151",
    hover: "#1f2937", accent: "#16a34a", tag: "#1f2937"
  } : {
    bg: "#f3f4f6", surface: "#ffffff", border: "#e5e7eb", text: "#111827",
    textSub: "#4b5563", textMuted: "#9ca3af", input: "#ffffff", inputBorder: "#d1d5db",
    hover: "#f9fafb", accent: "#16a34a", tag: "#f3f4f6"
  };

  if (onboarding) return <OnboardingForm onBack={() => setOnboarding(false)} onComplete={() => setOnboarding(false)} dark={dark} T={T} />;
  if (!session) return <Login onLogin={handleLogin} onOnboard={() => setOnboarding(true)} clients={clients} dark={dark} setDark={setDark} T={T} />;
  if (session.role === "client") return <ClientView session={session} accounts={accounts} onAdd={addAccount} onLogout={() => setSession(null)} clients={clients} dark={dark} setDark={setDark} T={T} />;
  return <AdminView accounts={accounts} onUpdate={updateAccount} onLogout={() => setSession(null)} clients={clients} setClients={setClients} dark={dark} setDark={setDark} T={T} />;
}

</script>
</body>
</html>
